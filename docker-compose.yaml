services:
  carla_headless:
    extends: carla_core
    command: /bin/bash ./CarlaUnreal.sh -RenderOffScreen --ros2
  carla:
    extends: carla_core
    command: /bin/bash ./CarlaUnreal.sh --ros2
  carla_core:
    image: carlasim/carla:0.10.0
    container_name: carla
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    network_mode: host
    environment:
      - FASTRTPS_DEFAULT_PROFILES_FILE=./fastrtps-profile.xml
      - DISPLAY=${DISPLAY}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
    command: /bin/bash ./CarlaUnreal.sh --ros2
    runtime: nvidia
  carla_bridge:
    extends: carla_bridge_core
    command: /bin/bash python ros2.py -f stack.json
    depends_on:
      - carla
  carla_bridge_headless:
    extends: carla_bridge_core
    command: /bin/bash python ros2.py -f stack.json
    depends_on:
      - carla_headless
  carla_bridge_core:
    build:
      context: .
      dockerfile: ./Dockerfile.carla_bridge
      network: host
    image: adore_carla_rosbridge:latest
    container_name: carla_ros_bridge
    depends_on:
      - carla
    runtime: nvidia
    privileged: true
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ./:/tmp/carla_bridge/
    network_mode: host
    environment:
      - FASTRTPS_DEFAULT_PROFILES_FILE=./fastrtps-profile.xml
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - DISPLAY=${DISPLAY}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
